[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "toolshed-cli"
version = "0.1.0"
description = "Toolshed — CLI toolkit developer: git helper cepat & file manager ringkas"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Your Name", email = "you@example.com" }
]
keywords = ["cli", "git", "developer-tools", "file-manager"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "click>=8.1",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
]

[project.scripts]
toolshed = "toolshed.cli:main"

[project.urls]
Homepage = "https://github.com/yourusername/toolshed-cli"
Issues = "https://github.com/yourusername/toolshed-cli/issues"

[tool.setuptools.packages.find]
where = ["src"]
